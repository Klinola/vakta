rules:
  - id: open-shadow-file
    name: /etc/shadow opened by non-root process
    severity: critical
    source: ebpf
    event_type: OPEN
    # event.uid is the REAL UID (bpf_get_current_uid_gid returns real UID per kernel semantics).
    # Deliberately fires on refused opens too (no event.ret guard): a process
    # that tried to read /etc/shadow and was denied is exactly what this rule
    # exists to catch. Contrast open-proc-kcore, where failures are pure noise.
    # Setuid-root binaries (sudo, su, passwd, etc.) run with real UID = invoking user (non-zero)
    # but effective UID = 0. Reading /etc/shadow is standard PAM password verification — not an
    # attack. Exclude known setuid auth tools by comm. Real attackers reading /etc/shadow directly
    # (e.g. via `cat`, `bash`, `python3`) will not match these comms and will still alert.
    condition: >
      (detail.path == "/etc/shadow" || detail.path == "/etc/gshadow") &&
      event.uid != 0 &&
      !event.comm.matches("^(sudo|su|pkexec|doas|passwd|chpasswd|chsh|chfn|usermod|unix_chkpwd|unix_update)$")
    tags: [credential-access, T1003.008]

  - id: open-ssh-private-key
    name: SSH private key file opened
    severity: high
    source: ebpf
    event_type: OPEN
    # ssh client reads the key to authenticate outbound connections — not an attack.
    # scp/rsync/git all exec ssh as a subprocess; their comm appears as "ssh" too.
    condition: >
      detail.path.matches(".*/(id_rsa|id_ecdsa|id_ed25519|id_dsa)$") &&
      !detail.path.contains(".pub") &&
      event.uid != 0 &&
      !event.comm.matches("^(ssh|scp|rsync|git)$")
    tags: [credential-access, T1552.004]

  - id: open-docker-socket
    name: Docker socket accessed by non-privileged process
    severity: high
    source: ebpf
    event_type: OPEN
    condition: >
      (detail.path == "/var/run/docker.sock" || detail.path == "/run/docker.sock") &&
      event.uid != 0
    tags: [privilege-escalation, container-escape, T1611]

  - id: open-proc-kcore
    name: Kernel memory opened (/proc/kcore, /proc/kmem, /dev/mem, /dev/kmem)
    severity: critical
    source: ebpf
    event_type: OPEN
    # The name lists every path this matches on purpose: it used to name only
    # /proc/kcore and /proc/kmem while also matching the two /dev nodes, so a
    # page read as "someone is reading kernel memory via /proc/kcore" when the
    # event was actually a refused open of /dev/mem. The alert now carries the
    # matched path as an annotation too.
    #
    # Only successful opens count. A refused open of these paths carries no
    # signal, and one benign pattern dominates it: util-linux lscpu falls back
    # to scanning /dev/mem for the SMBIOS table whenever
    # /sys/firmware/dmi/tables/DMI is unreadable, which is the normal state
    # inside a container — and containers are not given /dev/mem either, so the
    # open always fails with ENOENT. That pairing alone produced recurring P0s.
    #
    # runc still needs excluding because its open *succeeds*: /proc/kcore is one
    # of runc's maskedPaths, implemented by bind-mounting /dev/null over it
    # (verified — inside a container /proc/kcore is a bind mount of a tmpfs
    # /null), and setting up that mount opens the target. comm is "runc" for the
    # parent and "runc:[2:INIT]" for the namespace-init child; the old "^runc:"
    # pattern matched only the child.
    condition: >
      (detail.path == "/proc/kcore" || detail.path == "/proc/kmem" ||
       detail.path == "/dev/mem" || detail.path == "/dev/kmem") &&
      event.ret >= 0 &&
      !event.comm.matches("^runc($|:)")
    tags: [privilege-escalation, T1055]
